<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://document.span.local blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>图片预览</title>
  <link rel="stylesheet" href="preview.css">
  <script type="module" src="image.mjs"></script>
</head>
<body class="image-preview">
  <nav id="annotationControls" aria-label="文字选择与批注"></nav>
  <main id="pages" tabindex="0" aria-label="图片预览"><div id="imageFrame"><section id="imageStage" class="page"><img id="sourceImage" alt="原始图片" draggable="false"></section></div></main>
  <div id="zoomControls" role="group" aria-label="图片缩放">
    <button id="zoomOut" title="缩小">−</button><input id="zoomSlider" type="range" min="0.1" step="0.1" max="800" value="100" aria-label="缩放比例"><span id="zoom">100%</span><button id="zoomIn" title="放大">+</button>
    <button id="fit" title="适应窗口">↔</button><button id="actual" title="实际大小">1:1</button>
  </div>
  <p id="status" role="status">正在加载图片…</p>
</body>
</html>
